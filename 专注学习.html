<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="./account.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注学习 · 考研学习中心</title>
<link rel="stylesheet" href="./theme.css">
<style>
  :root {
    --bg: #eef1f6;
    --bg2: #e3e8f0;
    --card: #ffffff;
    --text: #1f2733;
    --muted: #7a869a;
    --border: #e6e9f0;
    --primary: #6366f1;
    --primary-d: #4f46e5;
    --success: #16a34a;
    --danger: #dc2626;
    --warn: #f97316;
    --eng: #0ea5e9;
    --math: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 22px 18px 44px; }

  .page-head {
    background: linear-gradient(135deg, #6366f1, #0ea5e9);
    color: #fff;
    border-radius: 18px;
    padding: 22px 26px;
    box-shadow: 0 10px 30px rgba(99,102,241,.25);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .page-head .logo { font-size: 32px; }
  .page-head h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
  .page-head .sub { margin-top: 6px; font-size: 13.5px; opacity: .92; }

  /* 计时卡片 */
  .timer-card {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    color: #fff;
    border-radius: 18px;
    padding: 28px 32px;
    box-shadow: 0 12px 36px rgba(15, 23, 42, .25);
    margin-bottom: 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .timer-card.idle {
    background: linear-gradient(135deg, #6366f1, #0ea5e9);
  }
  .timer-card.running {
    background: linear-gradient(135deg, #f97316 0%, #ef4444 100%);
  }
  .timer-card.running::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(255,255,255,.12), transparent 60%);
    pointer-events: none;
  }
  .timer-state {
    font-size: 13px;
    opacity: .85;
    margin-bottom: 8px;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .timer-display {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", Consolas, "Microsoft YaHei", monospace;
    line-height: 1;
    margin: 8px 0 16px;
  }
  .timer-task {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
    min-height: 24px;
  }
  .timer-task input {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.4);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    padding: 6px 12px;
    border-radius: 10px;
    width: min(360px, 90%);
    outline: none;
  }
  .timer-task input::placeholder { color: rgba(255,255,255,.6); }
  .timer-task input:focus { background: rgba(255,255,255,.28); border-color: #fff; }

  .timer-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .timer-btn {
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 800;
    padding: 12px 32px;
    border-radius: 14px;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .timer-btn.big {
    padding: 16px 48px;
    font-size: 18px;
    border-radius: 16px;
  }
  .timer-btn.start {
    background: #fff;
    color: var(--primary-d);
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .timer-btn.start:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,.22); }
  .timer-btn.stop {
    background: #fff;
    color: var(--danger);
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .timer-btn.stop:hover { transform: translateY(-1px); }
  .timer-btn.ghost {
    background: rgba(255,255,255,.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,.4);
  }
  .timer-btn.ghost:hover { background: rgba(255,255,255,.28); }
  .timer-btn.discard {
    background: rgba(255,255,255,.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,.3);
    font-weight: 600;
    padding: 12px 20px;
  }

  /* 统计卡片 */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  @media (max-width: 760px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .timer-display { font-size: 48px; }
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 6px 20px rgba(31,39,51,.06);
  }
  .stat-card .lbl {
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-card .val {
    font-size: 26px;
    font-weight: 800;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .val.eng { color: var(--eng); }
  .stat-card .val.math { color: var(--math); }
  .stat-card .val.total { color: var(--primary-d); }

  /* 日期选择 */
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 14px;
  }
  .date-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 9px 16px; border-radius: 12px;
    cursor: pointer; font-size: 14px; font-weight: 700;
  }
  .date-btn:hover { border-color: var(--primary); }
  .date-btn.active {
    background: linear-gradient(135deg, #6366f1, #0ea5e9);
    color: #fff; border-color: transparent;
  }
  .date-picker {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    background: var(--card);
  }

  /* 饼状图 + 详情 */
  .pie-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: 0 6px 20px rgba(31,39,51,.06);
    margin-bottom: 18px;
  }
  .pie-section h2 {
    margin: 0 0 14px; font-size: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .pie-section .tag {
    margin-left: auto; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; color: #fff;
    background: linear-gradient(135deg, #6366f1, #0ea5e9);
  }
  .pie-body {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    align-items: center;
  }
  @media (max-width: 760px) {
    .pie-body { grid-template-columns: 1fr; }
  }
  .pie-canvas-wrap {
    position: relative;
    width: 260px; height: 260px;
    margin: 0 auto;
  }
  .pie-canvas-wrap svg { width: 100%; height: 100%; }
  .pie-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  .legend-list { display: flex; flex-direction: column; gap: 8px; }
  .legend-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid #f1f5f9;
  }
  .legend-color {
    width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
  }
  .legend-name { font-weight: 700; flex: 1; font-size: 14px; }
  .legend-dur { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .legend-pct { color: var(--primary-d); font-weight: 800; font-size: 13px; min-width: 48px; text-align: right; }

  /* 会话列表 */
  .session-list-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: 0 6px 20px rgba(31,39,51,.06);
    margin-bottom: 18px;
  }
  .session-list-card h2 {
    margin: 0 0 14px; font-size: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .session-list { display: flex; flex-direction: column; gap: 10px; }
  .session-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: #f8fafc;
    border-radius: 12px;
    border-left: 4px solid var(--primary);
  }
  .session-item.running { border-left-color: var(--warn); background: #fff7ed; }
  .session-color {
    width: 10px; height: 36px; border-radius: 4px;
    flex-shrink: 0;
  }
  .session-body { flex: 1; min-width: 0; }
  .session-name {
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; gap: 8px;
  }
  .session-name input {
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    font-weight: 700; font-size: 15px; color: var(--text); outline: none;
    padding: 2px 4px; width: min(260px, 60%);
  }
  .session-name input:focus { border-bottom-color: var(--primary); }
  .session-meta {
    font-size: 12.5px; color: var(--muted); margin-top: 4px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .session-dur {
    font-weight: 800; color: var(--primary-d);
    font-variant-numeric: tabular-nums; font-size: 15px;
    min-width: 80px; text-align: right;
  }
  .session-del {
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px;
  }
  .session-del:hover { border-color: var(--danger); color: var(--danger); }
  .session-status {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; background: var(--warn); color: #fff;
  }

  .empty-tip {
    color: var(--muted); font-size: 13.5px; padding: 20px 0; text-align: center;
  }

  /* toast 提示 */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(15, 23, 42, .92); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: all .25s; z-index: 9999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: rgba(22, 163, 74, .92); }
  .toast.err { background: rgba(220, 38, 38, .92); }

  .footer-tip {
    font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-top: 12px;
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="page-head">
    <div class="logo">🎯</div>
    <div>
      <h1>专注学习</h1>
      <div class="sub">像番茄 ToDo 一样记录每日专注时长 · 按账号隔离 · 跨设备同步</div>
    </div>
  </div>

  <!-- 计时卡片 -->
  <div class="timer-card idle" id="timerCard">
    <div class="timer-state" id="timerState">⚡ 准备开始专注</div>
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-task" id="timerTask">
      <input type="text" id="taskNameInput" placeholder="点「开始专注」后在这里输入名称（例：英语精翻）" maxlength="40" disabled>
    </div>
    <div class="timer-actions" id="timerActions">
      <button class="timer-btn start big" id="btnStart">▶ 开始专注</button>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="lbl">📅 今日段数</div>
      <div class="val total" id="statCount">0</div>
    </div>
    <div class="stat-card">
      <div class="lbl">⏱ 今日总时长</div>
      <div class="val total" id="statTotal">0 分钟</div>
    </div>
    <div class="stat-card">
      <div class="lbl">📘 今日英语</div>
      <div class="val eng" id="statEng">0 分钟</div>
    </div>
    <div class="stat-card">
      <div class="lbl">📐 今日数学</div>
      <div class="val math" id="statMath">0 分钟</div>
    </div>
  </div>

  <!-- 日期选择 -->
  <div class="toolbar">
    <button class="date-btn active" id="dToday">📅 今日</button>
    <button class="date-btn" id="dYest">⏪ 昨日</button>
    <input type="date" class="date-picker" id="dPick">
    <button class="date-btn" id="dPrev" title="前一天">◀</button>
    <button class="date-btn" id="dNext" title="后一天">▶</button>
    <span style="color:var(--muted);font-size:13px;margin-left:auto;">共 <b id="totalDaysCount">0</b> 天有记录</span>
  </div>

  <!-- 饼状图 -->
  <div class="pie-section">
    <h2>🥧 专注分类饼状图 <span class="tag" id="pieDateTag">今日</span></h2>
    <div class="pie-body">
      <div class="pie-canvas-wrap">
        <svg id="pieSvg" viewBox="0 0 100 100"></svg>
        <div class="pie-empty" id="pieEmpty" style="display:none;">暂无记录</div>
      </div>
      <div class="legend-list" id="legendList"></div>
    </div>
  </div>

  <!-- 详情列表 -->
  <div class="session-list-card">
    <h2>📋 本日专注记录 <span class="tag" id="sessionCountTag" style="background:#f1f5f9;color:#475569;font-weight:800;">0 段</span></h2>
    <div class="session-list" id="sessionList">
      <div class="empty-tip">本日还没有专注记录，点上方「开始专注」开启第一段吧～</div>
    </div>
  </div>

  <div class="footer-tip">
    💡 数据存浏览器 localStorage（按当前账号隔离），并每 30 分钟自动同步到 Gist；右上角的 ☁️ 同步按钮可手动上传/下载。
    名称支持随时编辑修改；点击「删除」可移除误录记录（仅影响当前账号）。
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============== 基础工具 ==============
const STORE_KEY = "focusSessions_v1";
const RUNNING_KEY = "focusRunning_v1";
const COLOR_KEY = "focusColors_v1";
function $(id){ return document.getElementById(id); }
function curUser(){ return (window.getCurrentUser && window.getCurrentUser()) || ""; }
function ukey(base){ return curUser() ? ("user:" + curUser() + ":" + base) : base; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2, "0"); }
function fmtDate(d){
  if(typeof d === "string"){
    const p = d.split("-");
    return p[0] + "-" + pad(p[1]) + "-" + pad(p[2]);
  }
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function todayStr(){ return fmtDate(new Date()); }
function fmtTime(dateStr){
  const d = new Date(dateStr);
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmtHMS(seconds){
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if(h > 0) return `${h}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}
function fmtMin(seconds){
  const mins = Math.round(seconds / 60);
  if(mins >= 60) {
    const h = Math.floor(mins/60);
    const m = mins % 60;
    return h + " 小时 " + (m>0?(m+" 分"):"").trim();
  }
  return mins + " 分钟";
}
function toast(msg, type){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (type||"");
  setTimeout(() => { t.className = "toast " + (type||""); }, 1800);
}

// ============== 数据存取 ==============
function loadAll(){
  try { return JSON.parse(localStorage.getItem(ukey(STORE_KEY)) || "[]"); }
  catch(e){ return []; }
}
function saveAll(list){
  localStorage.setItem(ukey(STORE_KEY), JSON.stringify(list));
}
function loadRunning(){
  try { return JSON.parse(localStorage.getItem(ukey(RUNNING_KEY)) || "null"); }
  catch(e){ return null; }
}
function saveRunning(obj){
  if(obj === null) localStorage.removeItem(ukey(RUNNING_KEY));
  else localStorage.setItem(ukey(RUNNING_KEY), JSON.stringify(obj));
}
function loadColorMap(){
  try { return JSON.parse(localStorage.getItem(ukey(COLOR_KEY)) || "{}"); }
  catch(e){ return {}; }
}
function saveColorMap(m){
  localStorage.setItem(ukey(COLOR_KEY), JSON.stringify(m));
}

// 给类目分配稳定颜色
const PALETTE = [
  "#6366f1","#0ea5e9","#f59e0b","#ec4899","#16a34a",
  "#8b5cf6","#f97316","#06b6d4","#84cc16","#ef4444",
  "#a855f7","#14b8a6","#facc15","#fb7185","#22d3ee"
];
function colorFor(name, map){
  if(map[name]) return map[name];
  let idx = 0;
  for(const k in map){
    const i = PALETTE.indexOf(map[k]);
    if(i >= 0 && i >= idx) idx = i + 1;
  }
  if(idx >= PALETTE.length) idx = Object.keys(map).length % PALETTE.length;
  map[name] = PALETTE[idx];
  return map[name];
}

// ============== 当前选中日期 ==============
let viewDate = todayStr();   // 当前在看哪一天
let running = loadRunning(); // 正在进行的会话
let tickInterval = null;

// ============== 计时器 ==============
function startTick(){
  if(tickInterval) return;
  tickInterval = setInterval(refreshTimerDisplay, 1000);
}
function stopTick(){
  if(tickInterval){ clearInterval(tickInterval); tickInterval = null; }
}

function getElapsed(){
  if(!running) return 0;
  const start = new Date(running.startAt).getTime();
  let end;
  if(running.endAt) end = new Date(running.endAt).getTime();
  else end = Date.now();
  return Math.max(0, Math.floor((end - start) / 1000));
}

function refreshTimerDisplay(){
  const card = $("timerCard");
  const display = $("timerDisplay");
  const state = $("timerState");
  const actions = $("timerActions");
  const taskInput = $("taskNameInput");

  if(!running){
    card.classList.remove("running");
    card.classList.add("idle");
    state.textContent = "⚡ 准备开始专注";
    display.textContent = "00:00:00";
    taskInput.value = "";
    taskInput.disabled = true;
    taskInput.placeholder = "点「开始专注」后在这里输入名称";
    actions.innerHTML = `<button class="timer-btn start big" id="btnStart">▶ 开始专注</button>`;
    bindActionButtons();
    stopTick();
    return;
  }

  card.classList.remove("idle");
  card.classList.add("running");
  state.textContent = running.endAt ? "⏸ 已结束 · 未保存预览" : "🔥 专注中";
  display.textContent = fmtHMS(getElapsed());
  taskInput.disabled = !!running.endAt;
  if(document.activeElement !== taskInput){
    taskInput.value = running.name || "";
  }
  actions.innerHTML = running.endAt
    ? `<button class="timer-btn start big" id="btnSave">💾 保存这条记录</button>
       <button class="timer-btn discard" id="btnDiscard">✕ 放弃</button>`
    : `<button class="timer-btn stop big" id="btnStop">⏹ 结束专注</button>
       <button class="timer-btn ghost" id="btnCancel">✕ 取消</button>`;
  bindActionButtons();
}

function bindActionButtons(){
  const startBtn = $("btnStart");
  if(startBtn) startBtn.onclick = onStartClick;
  const stopBtn = $("btnStop");
  if(stopBtn) stopBtn.onclick = onStopClick;
  const cancelBtn = $("btnCancel");
  if(cancelBtn) cancelBtn.onclick = onCancelClick;
  const saveBtn = $("btnSave");
  if(saveBtn) saveBtn.onclick = onSaveEndedSession;
  const discardBtn = $("btnDiscard");
  if(discardBtn) discardBtn.onclick = onDiscardEndedSession;
}

function onStartClick(){
  if(running && !running.endAt){
    toast("已有专注进行中，请先结束", "err");
    return;
  }
  running = {
    id: "fs-" + Date.now() + "-" + Math.random().toString(36).slice(2,7),
    name: "",
    startAt: new Date().toISOString(),
    date: todayStr()
  };
  saveRunning(running);
  startTick();
  refreshTimerDisplay();
  setTimeout(() => {
    const inp = $("taskNameInput");
    inp.disabled = false;
    inp.focus();
    inp.placeholder = "输入本次专注名称（可空）";
  }, 50);
  toast("开始专注！命名后点「结束专注」保存", "ok");
}

function onStopClick(){
  if(!running || running.endAt) return;
  const name = ($("taskNameInput").value || "").trim();
  running.endAt = new Date().toISOString();
  running.name = name || running.name || "未命名专注";
  saveRunning(running);
  refreshTimerDisplay();
  stopTick();
  toast(`本次 ${fmtHMS(getElapsed())}，点「保存」入库`, "ok");
}

function onCancelClick(){
  if(!running) return;
  if(running.endAt){
    saveRunning(null);
    running = null;
    refreshTimerDisplay();
    toast("已放弃本次记录", "ok");
    return;
  }
  if(!confirm("确定取消本次专注？不保存任何记录。")) return;
  saveRunning(null);
  running = null;
  refreshTimerDisplay();
  toast("已取消", "ok");
}

function onSaveEndedSession(){
  if(!running || !running.endAt) return;
  const list = loadAll();
  list.push({
    id: running.id,
    name: running.name || "未命名专注",
    startAt: running.startAt,
    endAt: running.endAt,
    duration: getElapsed(),
    date: running.date
  });
  saveAll(list);
  const colorMap = loadColorMap();
  colorFor(list[list.length-1].name, colorMap);
  saveColorMap(colorMap);
  saveRunning(null);
  running = null;
  refreshTimerDisplay();
  viewDate = todayStr();
  renderAll();
  toast("已保存到「"+viewDate+"」", "ok");
}

function onDiscardEndedSession(){
  if(!running || !running.endAt) return;
  if(!confirm("放弃这条记录？该时段不会保存。")) return;
  saveRunning(null);
  running = null;
  refreshTimerDisplay();
  toast("已放弃", "ok");
}

// 名称输入时实时更新（仅运行中）
const nameInput = $("taskNameInput");
nameInput.addEventListener("input", () => {
  if(running && !running.endAt){
    running.name = nameInput.value;
    saveRunning(running);
  }
});
nameInput.addEventListener("blur", () => {
  if(running && running.endAt && nameInput.value.trim()){
    running.name = nameInput.value.trim();
    saveRunning(running);
    refreshTimerDisplay();
  }
});

// ============== 渲染 ==============
function renderAll(){
  const list = loadAll();
  // 今日统计
  const today = todayStr();
  const todayList = list.filter(s => s.date === today);
  const todayTotal = todayList.reduce((a,b)=>a+b.duration, 0);
  $("statCount").textContent = todayList.length;
  $("statTotal").textContent = fmtMin(todayTotal);
  // 分类：英语 / 数学 / 其他
  let eng = 0, math = 0;
  todayList.forEach(s => {
    if(/英语|english|eng|精翻|单词|阅读|作文|翻译/i.test(s.name)) eng += s.duration;
    else if(/数学|math|线代|高数|概率|做题|听课|刷题/i.test(s.name)) math += s.duration;
  });
  $("statEng").textContent = fmtMin(eng);
  $("statMath").textContent = fmtMin(math);

  // 更新日期按钮高亮
  ["dToday","dYest"].forEach(id => $(id).classList.remove("active"));
  if(viewDate === today) $("dToday").classList.add("active");
  else if(viewDate === fmtDate(new Date(Date.now() - 86400000))) $("dYest").classList.add("active");
  $("dPick").value = viewDate;

  // 日期标签
  const weekday = ["周日","周一","周二","周三","周四","周五","周六"][new Date(viewDate+"T00:00:00").getDay()];
  $("pieDateTag").textContent = viewDate + " " + weekday;

  // 总天数
  const allDays = new Set(list.map(s => s.date));
  $("totalDaysCount").textContent = allDays.size;

  // 渲染饼状图
  renderPie(viewDate);
  // 渲染会话列表
  renderSessionList(viewDate);
}

function renderPie(date){
  const list = loadAll().filter(s => s.date === date);
  const svg = $("pieSvg");
  const empty = $("pieEmpty");
  const legend = $("legendList");
  legend.innerHTML = "";

  if(list.length === 0){
    svg.innerHTML = "";
    empty.style.display = "flex";
    return;
  }
  empty.style.display = "none";

  // 合并同名
  const merged = {};
  list.forEach(s => {
    if(!merged[s.name]) merged[s.name] = 0;
    merged[s.name] += s.duration;
  });
  const items = Object.entries(merged).sort((a,b)=>b[1]-a[1]);
  const total = items.reduce((a,b)=>a+b[1], 0);

  // 分配颜色
  const colorMap = loadColorMap();
  items.forEach(([n]) => colorFor(n, colorMap));
  saveColorMap(colorMap);

  // 画饼（SVG）
  let acc = 0;
  const cx = 50, cy = 50, r = 42;
  const slicePath = (startA, endA) => {
    const x1 = cx + r * Math.cos(startA);
    const y1 = cy + r * Math.sin(startA);
    const x2 = cx + r * Math.cos(endA);
    const y2 = cy + r * Math.sin(endA);
    const large = (endA - startA) > Math.PI ? 1 : 0;
    return `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
  };
  let svgHtml = "";
  items.forEach(([name, dur]) => {
    if(total <= 0) return;
    const startA = (acc / total) * Math.PI * 2 - Math.PI/2;
    acc += dur;
    const endA = (acc / total) * Math.PI * 2 - Math.PI/2;
    const color = colorMap[name];
    svgHtml += `<path d="${slicePath(startA, endA)}" fill="${color}" stroke="#fff" stroke-width="0.5"><title>${esc(name)}: ${fmtHMS(dur)}</title></path>`;
  });
  // 中心圆（甜甜圈效果）
  svgHtml += `<circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/>`;
  svgHtml += `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="6" font-weight="800" fill="#1f2733">${fmtMin(total)}</text>`;
  svgHtml += `<text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="3.5" fill="#7a869a">总时长</text>`;
  svg.innerHTML = svgHtml;

  // 图例
  items.forEach(([name, dur]) => {
    const pct = total > 0 ? Math.round(dur / total * 100) : 0;
    const div = document.createElement("div");
    div.className = "legend-item";
    div.innerHTML = `
      <div class="legend-color" style="background:${colorMap[name]}"></div>
      <div class="legend-name">${esc(name)}</div>
      <div class="legend-dur">${fmtHMS(dur)} · ${pct}%</div>
    `;
    legend.appendChild(div);
  });
}

function renderSessionList(date){
  const list = loadAll().filter(s => s.date === date).sort((a,b)=>new Date(a.startAt) - new Date(b.startAt));
  const wrap = $("sessionList");
  $("sessionCountTag").textContent = list.length + " 段";

  if(list.length === 0){
    wrap.innerHTML = `<div class="empty-tip">${date === todayStr() ? "本日还没有专注记录，点上方「开始专注」开启第一段吧～" : "该日期没有专注记录"}</div>`;
    return;
  }

  const colorMap = loadColorMap();
  wrap.innerHTML = list.map((s, i) => {
    colorFor(s.name, colorMap);
    const start = new Date(s.startAt);
    const end = new Date(s.endAt);
    const durStr = fmtHMS(s.duration);
    return `
      <div class="session-item" data-id="${esc(s.id)}">
        <div class="session-color" style="background:${colorMap[s.name]}"></div>
        <div class="session-body">
          <div class="session-name">
            <input type="text" value="${esc(s.name)}" data-id="${esc(s.id)}" maxlength="40">
            <span class="session-meta">${i+1}.</span>
          </div>
          <div class="session-meta">
            <span>🕒 ${fmtTime(s.startAt)} - ${fmtTime(s.endAt)}</span>
            <span>📅 ${s.date}</span>
          </div>
        </div>
        <div class="session-dur">${durStr}</div>
        <button class="session-del" data-id="${esc(s.id)}" title="删除">🗑</button>
      </div>
    `;
  }).join("");
  saveColorMap(colorMap);

  // 绑定改名
  wrap.querySelectorAll(".session-name input").forEach(inp => {
    inp.addEventListener("change", () => {
      const id = inp.dataset.id;
      const newName = (inp.value || "").trim() || "未命名专注";
      updateSession(id, { name: newName });
      toast("已改名", "ok");
    });
    inp.addEventListener("blur", () => {
      const id = inp.dataset.id;
      const newName = (inp.value || "").trim() || "未命名专注";
      updateSession(id, { name: newName });
    });
  });
  wrap.querySelectorAll(".session-del").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const item = loadAll().find(s => s.id === id);
      if(!item) return;
      if(!confirm(`删除「${item.name}」(时长 ${fmtHMS(item.duration)})？`)) return;
      const newList = loadAll().filter(s => s.id !== id);
      saveAll(newList);
      renderAll();
      toast("已删除", "ok");
    };
  });
}

function updateSession(id, patch){
  const list = loadAll();
  const idx = list.findIndex(s => s.id === id);
  if(idx < 0) return;
  list[idx] = Object.assign({}, list[idx], patch);
  saveAll(list);
  renderAll();
}

// ============== 事件绑定 ==============
$("dToday").onclick = () => { viewDate = todayStr(); renderAll(); };
$("dYest").onclick = () => {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  viewDate = fmtDate(d);
  renderAll();
};
$("dPick").onchange = (e) => {
  if(e.target.value) { viewDate = e.target.value; renderAll(); }
};
$("dPrev").onclick = () => {
  const d = new Date(viewDate + "T00:00:00");
  d.setDate(d.getDate() - 1);
  viewDate = fmtDate(d);
  renderAll();
};
$("dNext").onclick = () => {
  const d = new Date(viewDate + "T00:00:00");
  d.setDate(d.getDate() + 1);
  viewDate = fmtDate(d);
  renderAll();
};

// 页面关闭/刷新前，如果有时钟在跑要保存 running
window.addEventListener("beforeunload", () => {
  if(running && !running.endAt) saveRunning(running);
});

// 启动
refreshTimerDisplay();
if(running && !running.endAt) startTick();
renderAll();
</script>
