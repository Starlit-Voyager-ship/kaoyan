<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学中心</title>
<!-- 账号隔离 + 登录（提供 window.uStorage / getCurrentUser / showLogin） -->
<script src="../account.js"></script>
<style>
  :root {
    --bg: #eef1f6;
    --bg2: #e3e8f0;
    --card: #ffffff;
    --text: #1f2733;
    --muted: #7a869a;
    --border: #e6e9f0;
    --primary: #6366f1;
    --primary-d: #4f46e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--text); min-height: 100vh;
  }
  /* 隐藏 account.js 自动注入的浮窗账号条（账号态由主站统一管） */
  #accChip,#accOverlay{display:none!important;}

  .container { max-width: 1200px; margin: 0 auto; padding: 10px 14px 24px; }
  .page-head {
    background: linear-gradient(135deg, #6366f1, #0ea5e9);
    color: #fff; border-radius: 14px; padding: 12px 20px;
    box-shadow: 0 6px 20px rgba(99,102,241,.2); position: relative;
  }
  .page-head h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  .page-head .subtitle { margin-top: 2px; font-size: 12.5px; opacity: .88; }
  .head-tools { position: absolute; top: 10px; right: 18px; display: flex; gap: 8px; align-items: center; }
  .acc-btn { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 12px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .acc-btn:hover { background: rgba(255,255,255,.28); }

  .module-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .module-tab {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 18px; border-radius: 12px; cursor: pointer; font-size: 14.5px; font-weight: 700;
    transition: all .15s; box-shadow: 0 1px 4px rgba(31,39,51,.04); position: relative;
  }
  .module-tab:hover { border-color: var(--primary); transform: translateY(-1px); }
  .module-tab.active { background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; border-color: transparent; }
  .module-tab .badge { position: absolute; top: -7px; right: -7px; font-size: 11px; font-weight: 700; color: #fff; background: #dc2626; border-radius: 9px; padding: 1px 6px; display: none; }
  .module-tab .badge.show { display: inline-block; }

  .frame-wrap {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; box-shadow: 0 4px 14px rgba(31,39,51,.05); height: 82vh;
  }
  iframe { width: 100%; height: 100%; border: none; display: none; background: #fff; }
  iframe.active { display: block; }

  @media (max-width: 640px) {
    .head-tools { position: static; margin-top: 10px; display: flex; }
    .frame-wrap { height: 86vh; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="page-head">
    <h1>📐 数学中心</h1>
    <div class="subtitle">考研数学二 · 学习平台</div>
    <div class="head-tools">
      <button id="switchAcc" class="acc-btn">切换 / 登录账号</button>
    </div>
  </div>

  <div class="module-tabs" id="nav">
    <button class="module-tab active" data-src="modules/mistakes.html" data-frame="f0">📕 错题与薄弱</button>
    <button class="module-tab" data-src="modules/summary.html" data-frame="f1">📊 归纳总结<span class="badge" id="badgeSummary">!</span></button>
    <button class="module-tab" data-src="modules/bank.html" data-frame="f2">📚 题集</button>
  </div>

  <div class="frame-wrap">
    <iframe id="f0" class="active" src="modules/mistakes.html"></iframe>
    <iframe id="f1" src="modules/summary.html"></iframe>
    <iframe id="f2" src="modules/bank.html"></iframe>
  </div>
</div>

<script>
  (function () {
    /* 若嵌入主站 iframe，隐藏自身账号按钮（跟随主站 #accChip 统一管理） */
    if (window !== window.top) {
      var ht = document.querySelector(".head-tools");
      if (ht) ht.style.display = "none";
    }

    /* 强制隐藏 account.js 注入的浮窗账号条（主站已统一管理账号） */
    function hideAccChip() {
      var c = document.getElementById("accChip");
      if (c) c.style.setProperty("display", "none", "important");
      var o = document.getElementById("accOverlay");
      if (o) o.style.setProperty("display", "none", "important");
    }
    hideAccChip();
    // account.js 可能延迟注入，用 MutationObserver 兜底
    if (typeof MutationObserver !== "undefined") {
      new MutationObserver(hideAccChip).observe(document.body, { childList: true });
    }

    var nav = document.getElementById("nav");
    var tabs = Array.prototype.slice.call(nav.querySelectorAll(".module-tab"));
    var frames = {
      f0: document.getElementById("f0"),
      f1: document.getElementById("f1"),
      f2: document.getElementById("f2")
    };

    function clearBadge() {
      var b = document.getElementById("badgeSummary");
      if (b) b.classList.remove("show");
    }
    window.clearSummaryBadge = clearBadge;

    function selectTab(el) {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      el.classList.add("active");
      var src = el.getAttribute("data-src");
      var fid = el.getAttribute("data-frame");
      var f = frames[fid];
      // 首次访问才加载；已加载过的直接显示（避免白闪）
      if (!f.dataset.loaded) {
        f.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "cb=" + Date.now();
        f.dataset.loaded = "1";
      }
      Object.keys(frames).forEach(function (k) { frames[k].classList.remove("active"); });
      f.classList.add("active");
      if (src.indexOf("summary") >= 0) clearBadge();
    }

    nav.addEventListener("click", function (e) {
      var item = e.target.closest(".module-tab");
      if (item) selectTab(item);
    });

    document.getElementById("switchAcc").addEventListener("click", function () {
      if (window.showLogin) window.showLogin();
    });

    // 子模块通信：navigate 跳转、newMistake 点亮徽标
    window.addEventListener("message", function (e) {
      if (!e.data) return;
      if (e.data.type === "navigate") {
        var el = nav.querySelector('.module-tab[data-src="' + e.data.src + '"]');
        if (el) selectTab(el);
      } else if (e.data.type === "newMistake") {
        var b = document.getElementById("badgeSummary");
        if (b) b.classList.add("show");
      }
    });
  })();
</script>
</body>
</html>
