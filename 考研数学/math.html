<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI 学习助理</title>
<script>console.log('📄 math.html v=13 LOADED at', new Date().toLocaleTimeString());</script>
<script src="../account.js"></script>
<!-- MathJax 公式渲染：配置 $ 为行内分隔符 -->
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$']], displayMath: [] },
  startup: { pageReady: function() { return MathJax.startup.defaultPageReady(); } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  /* iframe 内隐藏 account.js 自动账号条（账号态由主框架统一呈现） */
  #accChip,#accOverlay{display:none!important;}
  :root{
    --bg:#eef1f6; --bg2:#e3e8f0; --card:#ffffff;
    --text:#1f2733; --muted:#7a869a; --border:#e6e9f0;
    --primary:#6366f1; --primary-d:#4f46e5;
    --accent-teal:#0d9488; --warn:#dc2626;
    --sky:#0ea5e9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);font-size:14px;
    display:flex;flex-direction:column;}

  /* ── 顶部栏（考研学习中心风格）── */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;
    padding:14px 22px;box-shadow:0 6px 20px rgba(99,102,241,.22);flex-shrink:0;}
  .topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.5px;}
  .topbar .subtitle{font-size:12px;opacity:.9;margin-top:2px;}
  .conn-status{font-size:12px;background:rgba(255,255,255,.16);padding:6px 12px;
    border-radius:12px;display:flex;align-items:center;gap:6px;}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;}
  .btn-gear{margin-left:12px;width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .btn-gear:hover{background:rgba(255,255,255,.28);transform:rotate(35deg);}

  /* ── 聊天区（居中、限定宽度，贴近 WorkBuddy 对话布局）── */
  .chat-area{flex:1;overflow-y:auto;padding:22px 16px;scroll-behavior:smooth;}
  .chat-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .chat-area::-webkit-scrollbar{width:6px;}
  .chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  /* 消息 */
  .msg{display:flex;gap:10px;max-width:92%;animation:msgIn .25s ease-out;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .msg.user{flex-direction:row-reverse;align-self:flex-end;}
  .msg.ai{align-self:flex-start;}
  .msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:18px;flex-shrink:0;
    background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;margin-top:2px;}
  .msg.user .msg-avatar{background:var(--card);border:1px solid var(--border);font-size:16px;}
  .msg-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .msg-bubble{padding:11px 15px;border-radius:18px;line-height:1.65;font-size:14px;
    word-break:break-word;white-space:pre-wrap;}
  .msg.user .msg-bubble{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;
    border-bottom-right-radius:5px;}
  .msg.ai .msg-bubble{background:var(--card);color:var(--text);
    border-bottom-left-radius:5px;border:1px solid var(--border);
    box-shadow:0 2px 10px rgba(31,39,51,.05);}
  /* AI 消息内 Markdown */
  .msg.ai .msg-bubble p{margin:6px 0;}
  .msg.ai .msg-bubble p:first-child{margin-top:0;}
  .msg.ai .msg-bubble p:last-child{margin-bottom:0;}
  .msg.ai .msg-bubble code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:13px;}
  .msg.ai .msg-bubble pre{background:var(--bg);padding:11px 13px;border-radius:10px;
    overflow-x:auto;margin:8px 0;font-size:13px;border:1px solid var(--border);}
  .msg.ai .msg-bubble strong{color:var(--primary-d);}
  /* 标题 */
  .msg.ai .msg-bubble h1,.msg.ai .msg-bubble h2,.msg.ai .msg-bubble h3{
    color:var(--primary-d);margin:10px 0 6px;font-weight:700;}
  .msg.ai .msg-bubble h1{font-size:17px;border-bottom:2px solid var(--border);padding-bottom:4px;}
  .msg.ai .msg-bubble h2{font-size:15px;}
  .msg.ai .msg-bubble h3{font-size:14px;}
  /* 列表 */
  .msg.ai .msg-bubble ul,.msg.ai .msg-bubble ol{
    margin:6px 0;padding-left:20px;}
  .msg.ai .msg-bubble li{margin:3px 0;line-height:1.65;}
  /* MathJax 公式微调：行内公式不换行、行间公式居中带边距 */
  .msg.ai .msg-bubble .MathJax{font-size:1.05em!important;}
  .msg.ai .msg-bubble mjx-container[jax="SVG"]{display:inline-block;}
  .msg-time{font-size:11px;color:var(--muted);padding:0 5px;}

  /* 图片消息 */
  .msg-img{max-width:300px;max-height:220px;border-radius:12px;border:1px solid var(--border);
    cursor:pointer;transition:transform .15s;display:block;}
  .msg-img:hover{transform:scale(1.02);}
  .msg-ocr{margin-top:8px;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 10px;}
  .msg-ocr summary{cursor:pointer;color:var(--primary);font-weight:600;user-select:none;}
  .msg-ocr-text{margin-top:6px;white-space:pre-wrap;color:var(--text);line-height:1.6;max-height:200px;overflow:auto;}
  .img-placeholder{display:inline-block;padding:8px 14px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-size:12px;margin-top:4px;}

  /* 打字指示器 */
  .typing{display:flex;gap:5px;padding:12px 15px;background:var(--card);border-radius:18px;
    border-bottom-left-radius:5px;border:1px solid var(--border);width:fit-content;
    box-shadow:0 2px 10px rgba(31,39,51,.05);}
  .typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;
    animation:bounce .6s infinite alternate;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{to{opacity:.3;transform:translateY(-4px);}}

  /* ── 输入区 ── */
  .input-area{flex-shrink:0;padding:12px 16px 16px;background:transparent;}
  .input-inner{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:10px 12px;box-shadow:0 4px 18px rgba(31,39,51,.06);}
  .input-row{display:flex;gap:10px;align-items:flex-end;}
  .img-preview-wrap{position:relative;display:inline-block;flex-shrink:0;}
  #imgPreview{width:46px;height:46px;object-fit:cover;border-radius:10px;
    border:1px solid var(--border);cursor:pointer;opacity:0;transition:opacity .2s;}
  #imgPreview.show{opacity:1;}
  #imgRemove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
    background:var(--warn);color:#fff;border:none;font-size:10px;cursor:pointer;
    display:none;align-items:center;justify-content:center;line-height:1;}
  #imgPreview.show + #imgRemove{display:flex;}

  .input-wrap{flex:1;display:flex;flex-direction:column;gap:6px;}
  #msgInput{width:100%;min-height:42px;max-height:130px;padding:10px 12px;
    background:var(--bg);border:1px solid var(--border);border-radius:14px;
    color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;
    transition:border-color .2s;line-height:1.5;}
  #msgInput:focus{border-color:var(--primary);}
  #msgInput::placeholder{color:var(--muted);}

  .btn-row{display:flex;gap:8px;flex-shrink:0;align-items:flex-end;}
  .btn-send{height:40px;padding:0 20px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--primary),var(--sky));color:#fff;
    font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
    transition:filter .15s,opacity .15s;flex-shrink:0;}
  .btn-send:hover{filter:brightness(1.07);}
  .btn-send:disabled{opacity:.5;cursor:not-allowed;}
  .btn-upload{height:40px;padding:0 16px;border-radius:12px;border:1.5px solid var(--accent-teal);
    background:transparent;color:var(--accent-teal);font-size:13px;font-weight:700;
    cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
  .btn-upload:hover{background:rgba(13,148,136,.08);}
  .btn-upload:disabled{opacity:.4;cursor:not-allowed;}

  /* 打字中占位动画 */
  .typing-placeholder{display:inline-block;min-width:48px;height:14px;
    background:linear-gradient(90deg,var(--muted) 30%,transparent 0%);
    background-size:8px 100%;animation:typeBlink 1s steps(4) infinite;border-radius:3px;}
  @keyframes typeBlink{to{background-position:-32px 0;}}

  /* ── 收录弹窗 ── */
  .modal-mask{position:fixed;inset:0;background:rgba(20,24,35,.5);
    display:none;align-items:center;justify-content:center;z-index:9998;backdrop-filter:blur(3px);}
  .modal-mask.show{display:flex;}
  .modal{background:var(--card);border-radius:18px;width:min(460px,92vw);max-height:85vh;
    overflow-y:auto;padding:22px 24px;box-shadow:0 24px 64px rgba(0,0,0,.28);
    animation:modalIn .2s ease-out;}
  @keyframes modalIn{from{opacity:0;transform:scale(.96)translateY(12px);}to{opacity:1;transform:none;}}
  .modal h3{margin:0 0 4px;font-size:18px;color:var(--text);}
  .modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:700;}
  .modal select,.modal input[type=text]{width:100%;padding:10px 12px;
    background:var(--bg);border:1px solid var(--border);border-radius:11px;
    color:var(--text);font-size:14px;font-family:inherit;outline:none;}
  .modal select:focus,.modal input:focus{border-color:var(--primary);}
  .modal textarea{width:100%;min-height:62px;padding:10px 12px;
    background:var(--bg);border:1px solid var(--border);border-radius:11px;
    color:var(--text);font-size:14px;font-family:inherit;resize:vertical;outline:none;}
  .modal-hint{font-size:12px;color:var(--accent-teal);margin-top:6px;display:none;}
  .modal-hint.show{display:block;}
  .cfg-group{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg);}
  .cfg-title{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;}
  .cfg-group label{margin-top:8px;}
  .modal-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .modal-btns .btn-pri{flex:1;padding:11px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--primary),var(--sky));color:#fff;
    font-size:14px;font-weight:700;cursor:pointer;}
  .modal-btns .btn-pri:disabled{opacity:.5;cursor:not-allowed;}
  .modal-btns .btn-sec{padding:11px 18px;border-radius:12px;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-size:14px;cursor:pointer;}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:11px 22px;border-radius:13px;
    font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;
    box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}

  /* 隐藏的 file input */
  #fileInput{display:none;}

  @media(max-width:520px){
    .msg{max-width:96%;}
    .btn-upload span{display:none;}
  }
</style>
</head>
<body>

<!-- ═══ 顶部栏 ═══ -->
<div class="topbar">
  <div>
    <h1>✨ AI 学习助理</h1>
    <div class="subtitle">考研答疑 · 解题 · 知识点归纳（点击 ⚙️ 配置模型）</div>
  </div>
  <div class="conn-status" id="connStatus">
    <span class="conn-dot" id="connDot"></span>
    <span id="connText">连接中…</span>
  </div>
  <button class="btn-gear" id="btnSettings" title="设置 DeepSeek API Key">⚙️</button>
</div>

<!-- ═══ 聊天区 ═══ -->
<div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
    </div>
</div>

<!-- ═══ 输入区 ═══ -->
<div class="input-area">
  <div class="input-inner">
    <div class="input-row">
      <div class="img-preview-wrap">
        <img id="imgPreview" alt="预览图">
        <button id="imgRemove" title="移除图片">✕</button>
      </div>
      <div class="input-wrap">
        <textarea id="msgInput" placeholder="输入问题或粘贴题面… (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn-upload" id="btnUpload" title="收录到题库（需选来源和错因）"><span>📥 上传收录</span></button>
        <button class="btn-send" id="btnSend" title="发送给 AI 解答">➤ 发送</button>
      </div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*">
</div>

<!-- ═══ 收录弹窗 ═══ -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3>📥 收录到题库</h3>
    <div class="modal-sub">本题将存入你的错题本，便于后续复习与归纳</div>
    <label>题目内容 <small style="color:var(--muted);font-weight:400;">（图片会自动 OCR 识别，也可手动输入/粘贴文字）</small></label>
    <textarea id="mProblem" placeholder="从图片自动识别或在此输入题目文字..." rows="3"></textarea>
    <label>来源（书籍 / 试卷）</label>
    <select id="mBook">
      <option value="">请选择…</option>
      <option>660题</option><option>严选题</option><option>700题</option>
      <option>真题</option><option>课堂例题</option><option>其他</option>
    </select>
    <label>错因</label>
    <select id="mReason">
      <option value="">（未标注）</option>
      <option>不会做</option><option>计算错误</option><option>概念混淆</option><option>遗忘</option>
      <option>粗心大意</option><option>思路偏差</option>
    </select>
    <label>知识点 <small style="color:var(--muted);font-weight:400;">（留空则由 AI 分析）</small></label>
    <input type="text" id="mPoints" placeholder="如：特征值与特征向量，矩阵可逆">
    <div class="modal-hint" id="mAnalyzing">⏳ 正在分析本题知识点…</div>
    <label>备注（可选）</label>
    <textarea id="mNote" placeholder="自己的卡点、心得…"></textarea>
    <div class="modal-btns">
      <button class="btn-sec" id="modalCancel">取消</button>
      <button class="btn-pri" id="modalConfirm" disabled>确认收录</button>
    </div>
  </div>
</div>

<!-- ═══ Key 设置弹窗 ═══ -->
<div class="modal-mask" id="keyMask">
  <div class="modal">
    <h3>⚙️ 模型设置</h3>
    <div class="modal-sub">对话用 DeepSeek，读图用千问 VL，两路分开配置。</div>

    <div class="cfg-group">
      <div class="cfg-title">💬 对话模型（解答 / 知识点分析）</div>
      <label>API Base URL</label>
      <input type="text" id="baseUrlInput" placeholder="https://api.deepseek.com/v1">
      <label>API Key</label>
      <input type="text" id="apiKeyInput" placeholder="sk-...">
      <label>模型名</label>
      <input type="text" id="modelInput" placeholder="deepseek-chat">
    </div>

    <div class="cfg-group">
      <div class="cfg-title">👁️ 视觉模型（读图 / 公式识别）</div>
      <label>API Base URL</label>
      <input type="text" id="visionBaseUrlInput" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
      <label>API Key</label>
      <input type="text" id="visionKeyInput" placeholder="sk-...">
      <label>模型名</label>
      <input type="text" id="visionModelInput" placeholder="qwen-vl-max">
      <label>CORS 代理 <small style="color:var(--muted);font-weight:400;">（线上必填！如 https://your-proxy.com/?url= ，留空则直连）</small></label>
      <input type="text" id="visionCorsProxyInput" placeholder="https://corsproxy.io/?url=">
    </div>

    <div class="modal-hint show" id="keyStatus"></div>
    <div class="modal-btns">
      <button class="btn-sec" id="keyCancel">取消</button>
      <button class="btn-pri" id="keySave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/storage.js?v=3"></script>
<script src="js/capture.js?v=3"></script>
<script src="js/main.js?v=14"></script>
</body>
</html>
